name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CASSANDRA_CPUS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B --no-transfer-progress clean verify
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: docker compose build bench
      - run: docker compose up -d --wait --wait-timeout 360 cassandra
      - run: docker compose run --rm bench seed
      - run: docker compose run --rm bench validate
      - if: always()
        run: docker compose down
